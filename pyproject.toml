[project]
name = "incident-recovery"
version = "0.1.0"
description = "Local Docker demo of a detectable broken deployment and gateway revision switching"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "asyncpg>=0.29,<1.0",
    "pydantic>=2.7,<3.0",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    # The linter is a project dependency, not something CI hopes is on PATH:
    # `uv run ruff` failed to spawn until it was declared here.
    "ruff>=0.15,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

# Pin the rule set, not just the version. Ruff's default selection has widened
# across releases (0.15 -> 0.17 added UP, ASYNC, RUF, SIM, C4, ISC to the
# defaults), so an unconfigured gate means "whatever this month's ruff thinks" and
# a dependency bump turns CI red for code nobody touched. E4/E7/E9/F is the
# historical default: real errors only. Widening it is a deliberate commit.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
