# The console is the only browser-facing origin. It serves the app and proxies
# exactly the operator API surface to the internal `api` service; it never
# proxies the internal executor or gateway-control listeners, and it holds no
# Docker socket.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Single-page bundle: serve the known static entry points and asset bundle,
    # and deliberately 404 everything else rather than masking unknown paths
    # (including any internal path) behind an index.html fallback.
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    # Same-origin API proxy. Trailing-free proxy_pass preserves the request URI.
    location ~ ^/(incidents|alerts|demo|deployment|healthz) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events must stream, not buffer, and the connection is long.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }
}
