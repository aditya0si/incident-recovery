name: incident-recovery

x-app: &app
  build:
    context: .
  image: incident-recovery-app:local

x-livez-check: &livez-check
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez')"]
  interval: 3s
  timeout: 3s
  retries: 40
  start_period: 5s

x-healthz-check: &healthz-check
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
  interval: 3s
  timeout: 3s
  retries: 40
  start_period: 5s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  demo-healthy-v1:
    <<: *app
    command: ["python", "-m", "incident_recovery.demo"]
    environment:
      DEMO_REVISION: healthy-v1
      PORT: "8000"
    networks:
      - demo_net
    healthcheck: *livez-check

  demo-broken-v2:
    <<: *app
    command: ["python", "-m", "incident_recovery.demo"]
    environment:
      DEMO_REVISION: broken-v2
      PORT: "8000"
    networks:
      - demo_net
    healthcheck: *livez-check

  gateway:
    <<: *app
    command: ["python", "-m", "incident_recovery.gateway"]
    environment:
      GATEWAY_ROLE: proxy
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:8000"
    networks:
      - demo_net
      - internal_net
    depends_on:
      postgres:
        condition: service_healthy
      demo-healthy-v1:
        condition: service_healthy
      demo-broken-v2:
        condition: service_healthy
    healthcheck: *healthz-check

  # Internal switch listener. Deliberately has NO host port in the default
  # stack: it is reachable only over internal_net (by the API and, for Task 1
  # E2E, by the test-only Compose override). It is not a permanent host-facing
  # bypass of the forthcoming approval gate.
  gateway-control:
    <<: *app
    command: ["python", "-m", "incident_recovery.gateway"]
    environment:
      GATEWAY_ROLE: control
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    networks:
      - internal_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *healthz-check

  api:
    <<: *app
    command: ["python", "-m", "incident_recovery.api"]
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      GATEWAY_INTERNAL_URL: http://gateway-control:8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    networks:
      - internal_net
    depends_on:
      postgres:
        condition: service_healthy
      gateway-control:
        condition: service_healthy
    healthcheck: *healthz-check

  # Restricted internal executor. It accepts only a persisted operation id over
  # an authenticated internal channel and drives the fixed desired-state switch.
  # It exposes NO host port and deliberately receives NO Docker socket: gateway
  # revision switching needs no Docker power (restart remains deferred).
  executor:
    <<: *app
    command: ["python", "-m", "incident_recovery.executor"]
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      GATEWAY_INTERNAL_URL: http://gateway-control:8000
    networks:
      - internal_net
    depends_on:
      postgres:
        condition: service_healthy
      gateway-control:
        condition: service_healthy
    healthcheck: *healthz-check

  # Durable recovery worker: claims leased incidents, executes the persisted
  # operation through the executor, then verifies sustained functional recovery.
  worker:
    <<: *app
    command: ["python", "-m", "incident_recovery.worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      EXECUTOR_URL: http://executor:8000
      GATEWAY_URL: http://gateway:8000
      WORKER_ID: worker-1
      WORKER_POLL_INTERVAL: "1.0"
      RECOVERY_LEASE_SECONDS: "120"
      # Bounded investigation. The runtime model is configured separately from any
      # coding CLI credential. With no credentials the adapter fails closed and
      # escalates rather than substituting a script; `INVESTIGATION_ADAPTER=scripted`
      # is an explicit opt-in used only by tests / the labeled demo override.
      INVESTIGATION_ADAPTER: ${INVESTIGATION_ADAPTER:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-20}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      INVESTIGATION_MAX_TOOL_CALLS: ${INVESTIGATION_MAX_TOOL_CALLS:-12}
      INVESTIGATION_MAX_SECONDS: ${INVESTIGATION_MAX_SECONDS:-120}
      INVESTIGATION_LEASE_SECONDS: ${INVESTIGATION_LEASE_SECONDS:-180}
    networks:
      - internal_net
    depends_on:
      postgres:
        condition: service_healthy
      executor:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

networks:
  demo_net:
    driver: bridge
  internal_net:
    driver: bridge

volumes:
  pgdata:
    name: incident-recovery-pgdata
